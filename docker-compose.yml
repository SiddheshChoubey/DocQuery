services:
  valkey:
    image: valkey/valkey
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - 6379:6379
    volumes:
      - valkey_data:/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  valkey_data:
  qdrant_data:
